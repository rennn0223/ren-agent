[project]
name = "ren-agent"
version = "0.1.0"
description = "Automotive AI Agent with TUI, ROS2 control, and Ollama backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ren", email = "ren910223@gmail.com" }]

dependencies = [
    "textual>=0.80.0",
    "ollama>=0.3.0",
    "loguru>=0.7.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
ren-agent = "ren_agent.__main__:app"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ren_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
